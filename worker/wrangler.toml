name = "coopertech-analytics"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Daily email at 8am EST (1pm UTC)
[triggers]
crons = ["0 13 * * *"]

# KV namespace for download tracking
[[kv_namespaces]]
binding = "DOWNLOADS"
id = "fbac143bd2294d008069bcc467dd8787"

# Route on your domain to intercept /dl/* requests
# After deploying, add this route in the Cloudflare dashboard:
# Route: coopertech.cc/dl/*
# Worker: coopertech-analytics

# Secrets (set via `npx wrangler secret put <NAME>`):
# RESEND_API_KEY
# CF_API_TOKEN
# CF_ACCOUNT_ID
# NOTIFY_EMAIL
